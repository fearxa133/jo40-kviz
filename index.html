<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JO40 Kviz – Doktor medicine</title>
<style>
:root{
  --bg:#f6f5f1; --card:#fff; --ink:#1d2327; --muted:#69737a; --line:#e2e0d9;
  --accent:#0f6b5c; --accent-ink:#fff; --ok:#16794a; --ok-bg:#e3f4ea; --bad:#b3261e; --bad-bg:#fbe7e5; --warn-bg:#fff4d6; --warn:#7a5a00;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14181a; --card:#1d2326; --ink:#e8ecee; --muted:#95a1a8; --line:#2d363a; --accent:#3fb59f; --accent-ink:#06201b; --ok:#5fd394; --ok-bg:#173326; --bad:#ff8a80; --bad-bg:#3a1c1a; --warn-bg:#3a3010; --warn:#f0cf6a;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{opacity:.7;margin-left:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar>div{height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:14px;gap:8px}
.tag{display:inline-block;font-size:.75rem;background:var(--line);padding:2px 8px;border-radius:6px;margin-right:6px}
.q{font-size:1.15rem;font-weight:600;margin:6px 0 16px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;background:var(--line);font-size:.78rem;display:grid;place-items:center;color:var(--muted)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.expl{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:.95rem}
.warn{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:.85rem}
.big{font-size:2.6rem;font-weight:700;margin:0}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:.93rem}
.rev b{display:block}
.rev .a{color:var(--ok)} .rev .w{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div{background:var(--bg);border-radius:10px;padding:10px}
.stats b{display:block;font-size:1.3rem}
.stats span{font-size:.78rem;color:var(--muted)}
.flash{min-height:140px;cursor:pointer}
.star{background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--muted);padding:0}
.star.on{color:#e0a800}
select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label.sw{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;margin-right:14px}
.hint{color:var(--muted);font-size:.8rem;margin-top:12px}
</style>
</head>

["JU DZ KS","Osnovna medicinska dokumentacija je:",["Zdravstveni karton pacijenta s nalazima, uputnicama i izvještajima","Samo recept","Samo račun za pregled","Samo osiguranička kartica"],"Prema Zakonu o evidencijama u oblasti zdravstva.",1,1],

["JU DZ KS","Puno sedmično radno vrijeme radnika:",["40 sati","36 sati","42 sata","48 sati"],"U skladu sa Zakonom o radu FBiH.",1,1],
];

/* ---------- stanje ---------- */
const KEY="jo40-kviz-v1";
let store;
try{store=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){store={}}
store.stats=store.stats||{}; store.stars=store.stars||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const cats=[...new Set(Q.map(x=>x[0]))];
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let cfg={cats:new Set(cats),filter:"all",count:20,mode:"quiz",shuf:true};
let run=null;

function stat(q){return store.stats[q[1]]||{r:0,w:0,last:null}}

/* ---------- početna ---------- */
function home(){
  const seen=Q.filter(q=>stat(q).r+stat(q).w>0).length;
  const right=Object.values(store.stats).reduce((s,x)=>s+x.r,0), wrong=Object.values(store.stats).reduce((s,x)=>s+x.w,0);
  const acc=right+wrong?Math.round(100*right/(right+wrong)):0;
  const pool=getPool();
  app.innerHTML=`
  <h1>JO40 – Doktor medicine</h1>
  <p class="sub">Vježba za JU Dom zdravlja Kantona Sarajevo · ${Q.length} pitanja</p>
  <div class="card"><div class="stats">
    <div><b>${seen}/${Q.length}</b><span>viđeno</span></div>
    <div><b>${acc}%</b><span>ukupna tačnost</span></div>
    <div><b>${Q.filter(q=>stat(q).last===0).length}</b><span>trenutno pogrešno</span></div>
  </div></div>
  <div class="card"><h2>Oblasti</h2><div class="chips" id="cats"></div>
    <div class="row" style="margin-top:10px"><button class="ghost" id="all">Sve</button><button class="ghost" id="none">Nijedna</button></div></div>
  <div class="card"><h2>Postavke</h2>
    <div class="row" style="margin-bottom:12px">
      <label class="sw">Mod <select id="mode"><option value="quiz">Kviz (ponuđeni odgovori)</option><option value="flash">Kartice (prisjećanje)</option></select></label>
      <label class="sw">Pitanja <select id="count"><option>10</option><option>20</option><option>40</option><option value="9999">Sva</option></select></label>
    </div>
    <div class="row" style="margin-bottom:12px"><label class="sw">Prikaži <select id="filter">
      <option value="all">Sva pitanja</option><option value="orig">Samo originalna iz oglasa</option><option value="ext">Samo proširena</option>
      <option value="wrong">Samo pogrešno odgovorena</option><option value="new">Samo neviđena</option><option value="star">Samo označena ★</option></select></label></div>
    <label class="sw"><input type="checkbox" id="shuf"> Miješaj redoslijed odgovora</label>
  </div>
  <div class="row"><button class="primary" id="start">Počni (<span id="pc">${pool.length}</span>)</button>
  <button class="ghost" id="reset">Resetuj napredak</button></div>
  <p class="hint">Napredak se čuva u pregledniku. Tipke: 1–4 odabir odgovora, Enter/→ dalje.</p>`;
  const cc=$("#cats");
  cats.forEach(c=>{const n=Q.filter(q=>q[0]===c).length;const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",cfg.cats.has(c));b.innerHTML=esc(c)+`<small>${n}</small>`;
    b.onclick=()=>{cfg.cats.has(c)?cfg.cats.delete(c):cfg.cats.add(c);b.setAttribute("aria-pressed",cfg.cats.has(c));upd()};cc.append(b)});
  $("#all").onclick=()=>{cfg.cats=new Set(cats);home()};
  $("#none").onclick=()=>{cfg.cats=new Set();home()};
  ["mode","count","filter"].forEach(id=>{const e=$("#"+id);e.value=cfg[id];e.onchange=()=>{cfg[id]=id==="count"?+e.value:e.value;upd()}});
  $("#shuf").checked=cfg.shuf;$("#shuf").onchange=e=>cfg.shuf=e.target.checked;
  $("#start").onclick=()=>begin(getPool());
  $("#reset").onclick=()=>{if(confirm("Obrisati sav napredak i oznake?")){store={stats:{},stars:{}};save();home()}};
  function upd(){const n=getPool().length;$("#pc").textContent=n;$("#start").disabled=!n}
  upd();
}
function getPool(){
  return Q.filter(q=>{
    if(!cfg.cats.has(q[0]))return false;
    const s=stat(q);
    switch(cfg.filter){
      case "orig":return q[4]===1; case "ext":return q[4]===0;
      case "wrong":return s.last===0; case "new":return s.r+s.w===0;
      case "star":return store.stars[q[1]];
    } return true;
  });
}

/* ---------- tok ---------- */
function begin(pool){
  let items=shuffle(pool); if(cfg.count<items.length)items=items.slice(0,cfg.count);
  run={items,i:0,score:0,wrong:[],answered:false};
  cfg.mode==="flash"?flash():question();
}
function header(){
  const pct=Math.round(100*run.i/run.items.length);
  return `<div class="bar"><div style="width:${pct}%"></div></div>
  <div class="meta"><span>${run.i+1} / ${run.items.length}</span><span>Tačno: ${run.score}</span><button class="ghost" id="quit" style="padding:2px 10px">Izađi</button></div>`;
}
function starBtn(q){return `<button class="star ${store.stars[q[1]]?"on":""}" id="star" title="Označi za kasnije" aria-label="Označi pitanje">${store.stars[q[1]]?"★":"☆"}</button>`}
function bindCommon(q){
  $("#quit").onclick=()=>{if(confirm("Prekinuti vježbu?"))home()};
  $("#star").onclick=e=>{store.stars[q[1]]=!store.stars[q[1]];if(!store.stars[q[1]])delete store.stars[q[1]];save();e.target.classList.toggle("on");e.target.textContent=store.stars[q[1]]?"★":"☆"};
}
function record(q,ok){
  const s=stat(q);ok?s.r++:s.w++;s.last=ok?1:0;store.stats[q[1]]=s;save();
  if(ok)run.score++;else run.wrong.push(q);
}

function question(){
  const q=run.items[run.i];
  const opts=q[2].map((t,k)=>({t,ok:k===0}));
  const list=cfg.shuf?shuffle(opts):opts;
  run.answered=false;
  app.innerHTML=header()+`<div class="card">
    <div class="row" style="justify-content:space-between"><span class="tag">${esc(q[0])}${q[4]?"":" · prošireno"}</span>${starBtn(q)}</div>
    <div class="q">${esc(q[1])}</div>
    <div id="opts">${list.map((o,k)=>`<button class="opt" data-ok="${o.ok}"><span class="k">${k+1}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
    <div id="fb"></div></div>
    <div class="row"><button class="primary" id="next" disabled>${run.i+1===run.items.length?"Rezultat":"Dalje"}</button></div>`;
  bindCommon(q);
  const btns=[...document.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>answer(q,b,btns));
  $("#next").onclick=next;
}
function answer(q,b,btns){
  if(run.answered)return;run.answered=true;
  const ok=b.dataset.ok==="true";
  btns.forEach(x=>{x.disabled=true;if(x.dataset.ok==="true")x.classList.add("ok")});
  if(!ok)b.classList.add("bad");
  record(q,ok);
  $("#fb").innerHTML=`<div class="expl"><b>${ok?"✔ Tačno":"✘ Netačno"}</b>${q[3]?"<br>"+esc(q[3]):""}</div>`+(q[5]?`<div class="warn">⚠ Institucionalno pitanje – odgovor provjeriti u važećem Statutu/Pravilniku.</div>`:"");
  $("#next").disabled=false;$("#next").focus();
}
function flash(){
  const q=run.items[run.i];run.answered=false;
  app.innerHTML=header()+`<div class="card flash" id="fc">
    <div class="row" style="justify-content:space-between"><span class="tag">${esc(q[0])}</span>${starBtn(q)}</div>
    <div class="q">${esc(q[1])}</div><div id="fb" class="hint">Pokušaj odgovoriti naglas, pa klikni da otkriješ odgovor (Razmaknica).</div></div>
    <div class="row" id="ctl"><button class="primary" id="rev">Otkrij odgovor</button></div>`;
  bindCommon(q);
  const reveal=()=>{
    if(run.answered)return;run.answered=true;
    $("#fb").innerHTML=`<div class="expl"><b>${esc(q[2][0])}</b>${q[3]?"<br>"+esc(q[3]):""}</div>`+(q[5]?`<div class="warn">⚠ Provjeriti u važećem aktu.</div>`:"");
    $("#ctl").innerHTML=`<button class="primary" id="y">Znao/la sam</button><button class="ghost" id="n">Nisam znao/la</button>`;
    $("#y").onclick=()=>{record(q,true);next()};$("#n").onclick=()=>{record(q,false);next()};
  };
  $("#rev").onclick=reveal;$("#fc").onclick=e=>{if(!e.target.closest("button"))reveal()};
}
function next(){run.i++;if(run.i>=run.items.length)return result();cfg.mode==="flash"?flash():question()}
function result(){
  const n=run.items.length,p=Math.round(100*run.score/n);
  app.innerHTML=`<h1>Rezultat</h1><div class="card"><p class="big">${p}%</p><p>${run.score} od ${n} tačno</p></div>
  <div class="row" style="margin-bottom:16px"><button class="primary" id="again" ${run.wrong.length?"":"disabled"}>Ponovi pogrešne (${run.wrong.length})</button><button class="ghost" id="home">Početna</button></div>
  ${run.wrong.length?`<div class="card"><h2>Za ponoviti</h2>${run.wrong.map(q=>`<div class="rev"><b>${esc(q[1])}</b><span class="a">✔ ${esc(q[2][0])}</span>${q[3]?`<br><span style="color:var(--muted)">${esc(q[3])}</span>`:""}</div>`).join("")}</div>`:""}`;
  $("#home").onclick=home;$("#again").onclick=()=>begin(run.wrong.slice());
}

document.addEventListener("keydown",e=>{
  if(!run||!$("#opts")&&!$("#rev")&&!$("#y"))return;
  if(e.target.tagName==="SELECT")return;
  if(/^[1-9]$/.test(e.key)){const b=document.querySelectorAll(".opt")[+e.key-1];if(b&&!b.disabled)b.click()}
  else if((e.key==="Enter"||e.key==="ArrowRight")&&$("#next")&&!$("#next").disabled&&e.target.id!=="next"){$("#next").click()}
  else if(e.key===" "&&$("#rev")){e.preventDefault();$("#rev").click()}
});
home();
</script>
</body>
</html>
